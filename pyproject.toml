[project]
name = "noted"
version = "0.1.0"
description = "CLI tool for working with Apple Notes database"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "betterproto2>=0.10.0",
    "py7zr>=1.1.3",
    "weasyprint>=70.0",
]

[project.scripts]
noted = "noted.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noted"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Canonical project-init hooks stay verbatim so template diffs stay clean.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.pyrefly]
project_includes = ["src", "tests"]
search_path = ["src"]

[tool.deptry]
# The package imports itself as `noted` under the src/ layout.
known_first_party = ["noted"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
