[project]
name = "noted"
version = "0.1.0"
description = "CLI tool for working with Apple Notes database"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "loguru>=0.7",
]

[project.scripts]
noted = "noted.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noted"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project_includes = ["src"]
