[project]
name = "noted"
version = "0.1.0"
description = "CLI tool for working with Apple Notes database"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "betterproto>=2.0.0b7",
    "py7zr>=1.1.3",
    "weasyprint>=70.0",
]

[project.scripts]
noted = "noted.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noted"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project_includes = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
