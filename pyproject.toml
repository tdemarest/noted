[project]
name = "noted"
version = "0.1.0"
description = "CLI tool for working with Apple Notes database"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "betterproto2>=0.10.0",
    "py7zr>=1.1.3",
    "weasyprint>=70.0",
]

[project.scripts]
noted = "noted.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noted"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Canonical project-init hooks stay verbatim so template diffs stay clean.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplicity
    "T20",    # flake8-print
    "RUF",    # ruff-specific
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
]
ignore = [
    "D100",   # missing docstring in public module (handled per-file)
    "D104",   # missing docstring in public package
]
# Intended glyphs: multiplication sign in attachment counts, en dash for dashed-list bullets.
allowed-confusables = ["×", "–"]

[tool.ruff.lint.flake8-bugbear]
# Typer requires Option/Argument as defaults; the betterproto2 helpers return
# dataclasses.field(default_factory=...), so defaults are never shared.
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "betterproto2.field",
    "noted.tables._message",
    "noted.tables._repeated",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Raw JSON/HTML/Markdown goes to stdout by design; Rich would mangle markup.
"src/noted/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.pyrefly]
project_includes = ["src", "tests"]
search_path = ["src"]

[tool.deptry]
# The package imports itself as `noted` under the src/ layout.
known_first_party = ["noted"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
